# Blueprint Render : décrit d'un coup le service web et la base de données,
# pour un déploiement en un clic depuis le tableau de bord Render
# ("New +" → "Blueprint", puis sélectionner ce dépôt).
databases:
  - name: lra-suite-web-db
    plan: free
    databaseName: lra_suite_web
    user: lra_web

services:
  - type: web
    name: lra-suite-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lra-suite-web-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
